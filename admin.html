<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>CWF Portal | พื้นที่จัดการกองทุน</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #F8FAFC; font-family: 'Prompt', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .portal-box { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 450px; text-align: center; margin: 20px; }
    .btn-open { background-color: #10B981; color: white; border-radius: 12px; padding: 16px; font-weight: 700; width: 100%; border: none; transition: 0.3s; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
    .btn-open:hover { background-color: #059669; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); }
    .btn-logout { background-color: white; color: #DC2626; border-radius: 12px; padding: 12px; font-weight: 600; width: 100%; border: 1px solid #FCA5A5; margin-top: 15px; transition: 0.3s; }
    .btn-logout:hover { background-color: #FEF2F2; }
  </style>
</head>
<body>
<div class="portal-box">
  <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex justify-content-center align-items-center mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
    <i class="fa-solid fa-shield-halved"></i>
  </div>
  <h5 class="fw-bold text-dark mb-1">พื้นที่จัดการข้อมูล</h5>
  <h4 class="text-primary fw-bold mb-4" id="networkName">กำลังโหลดข้อมูล...</h4>
  
  <div class="alert alert-light border text-start small mb-4" style="border-radius: 12px;">
    <i class="fa-solid fa-circle-check text-success me-1"></i> ยืนยันสิทธิ์ผู้ดูแลระบบสำเร็จ<br>
    <i class="fa-solid fa-circle-info text-primary me-1"></i> คลิกปุ่มด้านล่างเพื่อเปิดหน้าต่างฐานข้อมูล Google Sheets ของตำบลคุณ
  </div>
  
  <button class="btn-open" onclick="openSheet()"><i class="fa-solid fa-file-excel me-2"></i> เปิดฐานข้อมูลตำบล</button>
  <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-2"></i> ออกจากระบบส่วนกลาง</button>
</div>

<script>
  const netName = localStorage.getItem("cwf_network_name");
  const sheetId = localStorage.getItem("cwf_sheet_id");

  if(!netName || !sheetId) {
    window.location.href = "universal_login.html";
  } else {
    document.getElementById('networkName').innerText = netName;
  }

  function openSheet() {
    window.open(`https://docs.google.com/spreadsheets/d/${sheetId}`, '_blank');
  }

  function logout() {
    localStorage.clear();
    window.location.href = "universal_login.html";
  }
</script>
</body>
</html>
